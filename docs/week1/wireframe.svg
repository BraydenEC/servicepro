<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700" font-family="ui-sans-serif, system-ui, sans-serif">
  <rect width="1000" height="700" fill="#020617"/>
  <text x="32" y="42" fill="#f1f5f9" font-size="20" font-weight="600">ServicePro Core — /core</text>
  <text x="32" y="64" fill="#94a3b8" font-size="13">Turn a client brief into a structured project</text>

  <!-- sidebar rail -->
  <rect x="0" y="0" width="18" height="700" fill="#0f172a"/>

  <!-- INTAKE -->
  <rect x="32" y="90" width="440" height="300" rx="12" fill="#0f172a" stroke="#1e293b"/>
  <text x="52" y="118" fill="#f1f5f9" font-size="14" font-weight="600">1 · Paste the brief</text>
  <rect x="52" y="134" width="400" height="180" rx="8" fill="#020617" stroke="#1e293b"/>
  <text x="66" y="158" fill="#64748b" font-size="12">"Hi — following up on the redesign we</text>
  <text x="66" y="178" fill="#64748b" font-size="12">discussed. Need it done by Nov 14. We</text>
  <text x="66" y="198" fill="#64748b" font-size="12">agreed $85/hr, I've tracked about 22</text>
  <text x="66" y="218" fill="#64748b" font-size="12">hours so far.  — Dana, Northwind Co"</text>
  <rect x="52" y="330" width="150" height="38" rx="8" fill="#6366f1"/>
  <text x="90" y="354" fill="#ffffff" font-size="13" font-weight="600">Extract core</text>
  <text x="220" y="354" fill="#64748b" font-size="11">⌘ + Enter</text>

  <!-- OUTPUT CARD -->
  <rect x="500" y="90" width="468" height="380" rx="12" fill="#0f172a" stroke="#1e293b"/>
  <text x="520" y="118" fill="#f1f5f9" font-size="14" font-weight="600">2 · Extracted project</text>
  <rect x="852" y="103" width="96" height="22" rx="11" fill="#6366f1" fill-opacity="0.1" stroke="#6366f1" stroke-opacity="0.2"/>
  <text x="864" y="118" fill="#818cf8" font-size="10">via Claude</text>

  <line x1="520" y1="134" x2="948" y2="134" stroke="#1e293b"/>
  <text x="520" y="162" fill="#94a3b8" font-size="11">PROJECT</text>
  <text x="700" y="162" fill="#f1f5f9" font-size="13">Website Redesign</text>
  <text x="520" y="194" fill="#94a3b8" font-size="11">CLIENT</text>
  <text x="700" y="194" fill="#f1f5f9" font-size="13">Northwind Co</text>
  <text x="520" y="226" fill="#94a3b8" font-size="11">RATE</text>
  <text x="700" y="226" fill="#f1f5f9" font-size="13">$85.00 / hr</text>
  <text x="520" y="258" fill="#94a3b8" font-size="11">HOURS LOGGED</text>
  <text x="700" y="258" fill="#f1f5f9" font-size="13">22.0</text>
  <text x="520" y="290" fill="#94a3b8" font-size="11">DEADLINE</text>
  <text x="700" y="290" fill="#f1f5f9" font-size="13">Nov 14 · in 87 days</text>
  <text x="520" y="322" fill="#94a3b8" font-size="11">STATUS</text>
  <rect x="700" y="308" width="92" height="20" rx="10" fill="#818cf8" fill-opacity="0.1" stroke="#818cf8" stroke-opacity="0.2"/>
  <text x="712" y="322" fill="#a5b4fc" font-size="10">In Progress</text>

  <line x1="520" y1="344" x2="948" y2="344" stroke="#1e293b"/>
  <text x="520" y="368" fill="#94a3b8" font-size="11">COMPUTED VALUE</text>
  <text x="700" y="370" fill="#f1f5f9" font-size="18" font-weight="600">$1,870.00</text>
  <text x="520" y="392" fill="#64748b" font-size="10">22.0 h × $85.00 — calculated, not extracted</text>

  <rect x="520" y="410" width="160" height="38" rx="8" fill="#6366f1"/>
  <text x="548" y="434" fill="#ffffff" font-size="13" font-weight="600">Save to database</text>
  <rect x="692" y="410" width="110" height="38" rx="8" fill="none" stroke="#1e293b"/>
  <text x="716" y="434" fill="#94a3b8" font-size="13">Re-run</text>

  <!-- SAVED -->
  <rect x="32" y="410" width="440" height="250" rx="12" fill="#0f172a" stroke="#1e293b"/>
  <text x="52" y="438" fill="#f1f5f9" font-size="14" font-weight="600">3 · Saved outputs</text>
  <text x="400" y="438" fill="#64748b" font-size="11">3 saved</text>
  <line x1="52" y1="452" x2="452" y2="452" stroke="#1e293b"/>
  <text x="52" y="478" fill="#f1f5f9" font-size="12">Website Redesign</text>
  <text x="52" y="496" fill="#64748b" font-size="10">Northwind Co · $1,870.00 · via Claude</text>
  <line x1="52" y1="510" x2="452" y2="510" stroke="#1e293b"/>
  <text x="52" y="534" fill="#f1f5f9" font-size="12">Q4 Brand Sprint</text>
  <text x="52" y="552" fill="#64748b" font-size="10">Solstice Inc · $4,200.00 · via Claude</text>
  <line x1="52" y1="566" x2="452" y2="566" stroke="#1e293b"/>
  <text x="52" y="590" fill="#f1f5f9" font-size="12">API Integration</text>
  <text x="52" y="608" fill="#64748b" font-size="10">Vertex Labs · rate not found · heuristic</text>

  <text x="500" y="500" fill="#64748b" font-size="11">Fallback state — no model key configured:</text>
  <rect x="500" y="512" width="468" height="60" rx="8" fill="#0f172a" stroke="#1e293b" stroke-dasharray="4 3"/>
  <rect x="516" y="528" width="104" height="20" rx="10" fill="#fbbf24" fill-opacity="0.1" stroke="#fbbf24" stroke-opacity="0.2"/>
  <text x="528" y="542" fill="#fbbf24" font-size="10">heuristic</text>
  <text x="636" y="542" fill="#94a3b8" font-size="11">Same card, extraction source stated plainly</text>
</svg>
